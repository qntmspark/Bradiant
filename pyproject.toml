[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "braidiant"
version = "0.1.0"
description = "Reproducible consistency audits and braid representations for multiplicity-free anyon models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Braidiant contributors"}]
keywords = ["topological quantum computing", "anyons", "fusion categories", "braid groups", "research software"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Scientific/Engineering :: Physics"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.6"]

[project.scripts]
braidiant = "braidiant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
