[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bradiant"
version = "0.3.0"
description = "Reproducible consistency audits and braid representations for multiplicity-free anyon models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Bradiant contributors"}]
keywords = ["topological quantum computing", "anyons", "fusion categories", "braid groups", "research software"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Physics"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.6"]

[project.scripts]
bradiant = "bradiant.cli:main"
braidiant = "bradiant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[project.urls]
Homepage = "https://github.com/qntmspark/Bradiant/tree/main"
Source = "https://github.com/qntmspark/Bradiant"
Documentation = "https://github.com/qntmspark/Bradiant/tree/main/docs"
Issues = "https://github.com/qntmspark/Bradiant/issues"
