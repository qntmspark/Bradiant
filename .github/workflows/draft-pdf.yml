name: JOSS manuscript PDF
on:
  push:
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manuscript
        uses: actions/checkout@v4
      - name: Typeset with official Open Journals builder
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md
      - name: Upload typeset paper
        uses: actions/upload-artifact@v4
        with:
          name: bradiant-joss-draft
          path: paper.pdf
          if-no-files-found: error
